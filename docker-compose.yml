# Formato de puerto:
# Puerto_Host : Puerto_Contenedor

services:
  postgres:
    image: postgres:18-alpine3.24 
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: igor_db
    ports:
      - 5432:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis:8.10.1-alpine
    restart: always
    ports:
      - 6379:6379

  # API en contenedor (opcional). Solo se levanta con: docker compose --profile app up
  # Toma las variables de .env y apunta la BD y Redis a los servicios de este compose.
  api:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/igor_db
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - 3000:3000
    depends_on:
      - postgres
      - redis


